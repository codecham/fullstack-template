# Copier configuration: the questions asked when a project is generated.
# Docs: https://copier.readthedocs.io/en/stable/configuring/

_min_copier_version: "9.5.0"
_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Project name, as people will read it
  placeholder: My App
  validator: "{% if not project_name.strip() %}The project name is required{% endif %}"

project_slug:
  type: str
  help: Short name used for folders, containers and the database (lowercase, digits, dashes)
  default: "{{ project_name.strip().lower() | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*[a-z0-9]$')) %}
    Use lowercase letters, digits and dashes, starting with a letter
    {% endif %}

description:
  type: str
  help: One sentence that describes the project
  default: A fullstack web application

author_name:
  type: str
  help: Your name (used in the license)
  default: Your Name

author_email:
  type: str
  help: Contact email (used in SECURITY.md for vulnerability reports)
  default: you@example.com

license:
  type: str
  help: License of the generated project
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0
    None (all rights reserved): None
  default: MIT

use_pgvector:
  type: bool
  help: Use the pgvector Postgres image and enable the vector extension (for embeddings)?
  default: false

# Derived value, not asked: database name and user (no dashes in Postgres identifiers)
db_name:
  type: str
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

_message_before_copy: |
  Generating your project. After the files are written, `make setup` installs
  everything and starts the stack (Docker must be running).

_tasks:
  - command: git init --quiet --initial-branch=main
    when: "{{ _copier_operation == 'copy' }}"
  - command: make setup
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
  Done! Your project is in {{ _copier_conf.dst_path }}.

    cd {{ _copier_conf.dst_path }}
    make help

  Frontend: http://localhost:3000   API docs: http://localhost:8000/docs
  If setup was skipped or failed, fix the cause and run `make setup` again.
