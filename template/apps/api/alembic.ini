# Alembic configuration (database migrations).
# Docs: https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# The database URL is not stored here: migrations/env.py reads it from the app settings.

[alembic]
script_location = %(here)s/migrations

# File names start with the date, so `ls migrations/versions` lists them in order
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Lets env.py import the "app" package
prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Format, then lint, every newly generated migration file
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
